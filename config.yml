baseURL: "https://drivechain.win/"
title: "Drivechain for the win"
languageCode: "en-US"

# Single-page site: nothing but the notice. No taxonomies, no feeds.
disableKinds: ["taxonomy", "term", "RSS"]

params:
  description: "pECX burn status: whether the official eCash (ECX) burn and redemption specification has been published yet, and what to do once it is."
  contact: "contact@drivechain.win"
  rawStatePath: "/pecx_burn.json"   # the JSON the watcher cron job maintains

# Raw HTML in markdown stays off; the page is rendered by a shortcode instead.
markup:
  goldmark:
    renderer:
      unsafe: false

minify:
  minifyOutput: true
