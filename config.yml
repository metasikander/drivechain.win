baseURL: "https://drivechain.win/"
title: "Drivechain for the win"
languageCode: "en-US"

# Single-page site: nothing but the notice. No taxonomies, no feeds.
disableKinds: ["taxonomy", "term", "RSS"]

params:
  description: "Unofficial, AI-written notices on the eCash (ECX) launch from Bitcoin: the practice-coin burn on the Alphanet, and the betanet fork at Bitcoin block 967,680. Every claim carries its source; verify everything at the source."
  contact: "contact@drivechain.win"
  rawStatePath: "/pecx_burn.json"   # the JSON the burn notice renders at /burn/

# Raw HTML in markdown stays off; the page is rendered by a shortcode instead.
markup:
  goldmark:
    renderer:
      unsafe: false

minify:
  minifyOutput: true
