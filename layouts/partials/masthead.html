<header class="masthead">
  <a class="masthead__mark" href="{{ "/" | relURL }}"><b>drivechain</b><span>.win</span></a>
  <nav class="masthead__nav" aria-label="Site">
    {{- if .IsHome }}<a href="{{ "betanet/" | relURL }}">The betanet</a>
    {{- else }}<a href="{{ "/" | relURL }}">Home</a>{{ end }}
    {{- with site.Params.rawStatePath }}<a href="{{ . | relURL }}">Raw state (JSON)</a>{{ end }}
    {{- with site.Params.contact }}<a href="mailto:{{ . }}">Contact</a>{{ end }}
  </nav>
</header>
